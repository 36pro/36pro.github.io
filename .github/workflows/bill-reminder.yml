name: Monthly Bill Reminder

on:
  schedule:
    - cron: '0 3 1 * *'   # Runs at 3:00 AM UTC (9:00 AM Bangladesh Time) on the 1st of every month
  workflow_dispatch:      # Allows triggering manually from the GitHub Actions tab

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Run Reminder Script
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: node .github/scripts/send-email.js
