name: DESCO Low Balance Alert

on:
  schedule:
    # Runs at 18:15 UTC (12:15 AM Bangladesh Standard Time) every night right after midnight reading sync
    - cron: '15 18 * * *'
  workflow_dispatch:       # Allows triggering manually from the GitHub Actions tab

jobs:
  check-balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Check DESCO Balances
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
        run: node .github/scripts/check-desco-balance.js
