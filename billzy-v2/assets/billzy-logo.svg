<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 65" width="100%" height="100%" fill="none">
  <style>
    .bz-text { fill: #0F172A; }
    .bz-dot { fill: #059669; }
    .bz-center-outer { fill: #0F172A; }
    .bz-center-inner { fill: #FFFFFF; }
    .bz-pipe-green { stroke: #059669; }
    .bz-pipe-blue { stroke: #0284C7; }
    .bz-pipe-amber { stroke: #EA580C; }
    @media (prefers-color-scheme: dark) {
      .bz-text { fill: #FFFFFF; }
      .bz-dot { fill: #00E676; }
      .bz-center-outer { fill: #FFFFFF; }
      .bz-center-inner { fill: #020817; }
      .bz-pipe-green { stroke: #00E676; }
      .bz-pipe-blue { stroke: #00C2FF; }
      .bz-pipe-amber { stroke: #FF7A00; }
    }
  </style>
  <!-- Trefoil Mark -->
  <g transform="translate(6, 8)">
    <path class="bz-pipe-green" d="M25 25 C25 8, 35 5, 25 5 C15 5, 25 8, 25 25 Z" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <path class="bz-pipe-blue" d="M25 25 C38 18, 45 30, 38 37 C31 44, 31 32, 25 25 Z" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <path class="bz-pipe-amber" d="M25 25 C12 18, 5 30, 12 37 C19 44, 19 32, 25 25 Z" stroke-width="3.8" stroke-linecap="round" fill="none"/>
    <circle class="bz-center-outer" cx="25" cy="25" r="3.8"/>
    <circle class="bz-center-inner" cx="25" cy="25" r="1.8"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(68, 44)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" letter-spacing="-0.5" class="bz-text">
      billzy<tspan class="bz-dot">°</tspan>
    </text>
  </g>
</svg>