<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <!-- M29 Rotary Selector Switch Mark -->
  <g transform="translate(10, 8)">
    <circle cx="30" cy="30" r="26" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <!-- 3 Utility Dial Markers: Power (Mint), Water (Aqua), Gas (Amber) -->
    <circle cx="30" cy="10" r="3.5" fill="#00E676"/>
    <circle cx="48" cy="40" r="3.5" fill="#00C2FF"/>
    <circle cx="12" cy="40" r="3.5" fill="#FF7A00"/>
    <!-- Rotary Pointer Knob -->
    <circle cx="30" cy="30" r="14" fill="#27272A" stroke="#71717A" stroke-width="1.5"/>
    <line x1="30" y1="30" x2="30" y2="12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="30" cy="30" r="3.5" fill="#00C2FF"/>
  </g>
  <!-- M37 Plus Jakarta Sans Typography with Degree Symbol -->
  <g transform="translate(85, 48)">
    <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5" fill="#FFFFFF">
      billzy<tspan fill="#00E676">°</tspan>
    </text>
  </g>
  <g transform="translate(86, 65)">
    <text font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="8.5" letter-spacing="3" fill="#00C2FF">
      MULTI-UTILITY SELECTOR FLOW
    </text>
  </g>
</svg>