    <path class="bz-pipe-blue" d="M30 30 C46 22, 54 36, 46 44 C38 52, 38 38, 30 30 Z" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <path class="bz-pipe-amber" d="M30 30 C14 22, 6 36, 14 44 C22 52, 22 38, 30 30 Z" stroke-width="4.2" stroke-linecap="round" fill="none"/>
    <circle class="bz-center-outer" cx="30" cy="30" r="4.5"/>
