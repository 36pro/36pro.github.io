<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="100%" height="100%" fill="none">
  <style>
    .bz-text { fill: #0F172A; }
    .bz-subtext { fill: #0284C7; }
    .bz-dot { fill: #059669; }
    .bz-center-outer { fill: #0F172A; }
    .bz-center-inner { fill: #FFFFFF; }
    .bz-pipe-green { stroke: #059669; }
    .bz-pipe-blue { stroke: #0284C7; }
    .bz-pipe-amber { stroke: #EA580C; }
