<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="sg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#050714" stroke="#161B3D" stroke-width="1.5"/>
  <!-- Left Electrode Rod & Sphere -->
  <line x1="8" y1="40" x2="26" y2="40" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="26" cy="40" r="7" fill="#38BDF8"/>
  <!-- Right Electrode Rod & Sphere -->
  <line x1="72" y1="40" x2="54" y2="40" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
