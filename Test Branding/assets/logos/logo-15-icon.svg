<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="op-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#010D05" stroke="#0D3818" stroke-width="1.5"/>
  <!-- Oscilloscope Grid Lines -->
  <line x1="10" y1="40" x2="70" y2="40" stroke="#0D3818" stroke-width="1.5"/>
  <line x1="40" y1="10" x2="40" y2="70" stroke="#0D3818" stroke-width="1.5"/>
  <circle cx="40" cy="40" r="28" stroke="#0D3818" stroke-width="1" stroke-dasharray="2 4"/>
  
  <!-- Continuous AC Sine Wave 'B' -->
  <path d="M22 64 V16 H40 C52 16, 56 22, 56 28 C56 34, 50 38, 42 39 C52 40, 58 46, 58 54 C58 64, 46 64, 22 64 Z" 
        stroke="#39FF14" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#op-glow)"/>
  <!-- Live Signal Wave Injected into Spine -->
  <path d="M14 40 L22 40 L26 28 L30 52 L34 36 L38 42 L42 40" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>
  <!-- Harmonic Pulse Dots -->
  <circle cx="56" cy="28" r="3" fill="#39FF14" filter="url(#op-glow)"/>
  <circle cx="58" cy="54" r="3" fill="#39FF14" filter="url(#op-glow)"/>
</svg>