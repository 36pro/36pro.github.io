<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="qg-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#030014" stroke="#221138" stroke-width="1.5"/>
  <!-- Scanlines -->
  <line x1="10" y1="20" x2="70" y2="20" stroke="#FF007A" stroke-width="0.75" opacity="0.3"/>
  <line x1="10" y1="36" x2="70" y2="36" stroke="#00F0FF" stroke-width="0.75" opacity="0.3"/>
  <line x1="10" y1="52" x2="70" y2="52" stroke="#FF007A" stroke-width="0.75" opacity="0.3"/>
  <line x1="10" y1="68" x2="70" y2="68" stroke="#00F0FF" stroke-width="0.75" opacity="0.3"/>
  
  <!-- Red/Magenta Glitch Channel (Shifted Right) -->
  <g transform="translate(3, -1)" opacity="0.85" filter="url(#qg-glow)">
    <path d="M24 16 H44 C52 16 56 21 56 28 C56 34 51 37 45 38 C53 39 58 44 58 52 C58 60 52 64 42 64 H24 Z" 
          fill="none" stroke="#FF007A" stroke-width="4.5" stroke-linecap="square"/>
  </g>
  <!-- Cyan Glitch Channel (Shifted Left) -->
  <g transform="translate(-3, 1)" opacity="0.85" filter="url(#qg-glow)">
    <path d="M24 16 H44 C52 16 56 21 56 28 C56 34 51 37 45 38 C53 39 58 44 58 52 C58 60 52 64 42 64 H24 Z" 
          fill="none" stroke="#00F0FF" stroke-width="4.5" stroke-linecap="square"/>
  </g>
  <!-- Core White Beam (Centered) -->
  <path d="M24 16 H44 C52 16 56 21 56 28 C56 34 51 37 45 38 C53 39 58 44 58 52 C58 60 52 64 42 64 H24 Z" 
        fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <!-- Glitch Slice Artifacts -->
  <rect x="18" y="34" width="22" height="4" fill="#030014"/>
  <rect x="16" y="34" width="6" height="4" fill="#00F0FF"/>
  <rect x="42" y="34" width="8" height="4" fill="#FF007A"/>
</svg>