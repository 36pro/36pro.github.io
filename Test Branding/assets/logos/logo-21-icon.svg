<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="tk-bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0E1229" />
      <stop offset="100%" stop-color="#040711" />
    </radialGradient>
    <filter id="tk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="url(#tk-bg)" stroke="#1E2548" stroke-width="1.5"/>
  <!-- Toroidal Magnetic Rings -->
  <ellipse cx="40" cy="40" rx="26" ry="12" stroke="#8A2BE2" stroke-width="2.5" transform="rotate(0 40 40)" filter="url(#tk-glow)"/>
  <ellipse cx="40" cy="40" rx="26" ry="12" stroke="#00F7FF" stroke-width="2.5" transform="rotate(60 40 40)" filter="url(#tk-glow)"/>
  <ellipse cx="40" cy="40" rx="26" ry="12" stroke="#8A2BE2" stroke-width="2.5" transform="rotate(120 40 40)" filter="url(#tk-glow)"/>
  <!-- Central White-Hot Plasma Core Spark -->
  <circle cx="40" cy="40" r="6" fill="#00F7FF" filter="url(#tk-glow)"/>
  <circle cx="40" cy="40" r="3" fill="#FFFFFF"/>
</svg>