<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="my-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#13091F" stroke="#2D1B48" stroke-width="1.5"/>
  <!-- Mycelium Tendril Connections -->
  <line x1="20" y1="26" x2="40" y2="18" stroke="#C084FC" stroke-width="2"/>
  <line x1="40" y1="18" x2="60" y2="28" stroke="#C084FC" stroke-width="2"/>
  <line x1="20" y1="26" x2="32" y2="44" stroke="#C084FC" stroke-width="2"/>
  <line x1="60" y1="28" x2="52" y2="48" stroke="#C084FC" stroke-width="2"/>
  <line x1="32" y1="44" x2="52" y2="48" stroke="#2DD4BF" stroke-width="2.5" filter="url(#my-glow)"/>
  <line x1="32" y1="44" x2="40" y2="64" stroke="#C084FC" stroke-width="2"/>
  <line x1="52" y1="48" x2="40" y2="64" stroke="#C084FC" stroke-width="2"/>
  <!-- 7 Synaptic Nodes -->
  <circle cx="20" cy="26" r="4.5" fill="#C084FC"/>
  <circle cx="40" cy="18" r="5" fill="#2DD4BF" filter="url(#my-glow)"/>
  <circle cx="60" cy="28" r="4.5" fill="#C084FC"/>
  <circle cx="32" cy="44" r="6" fill="#2DD4BF" filter="url(#my-glow)"/>
  <circle cx="52" cy="48" r="6" fill="#2DD4BF" filter="url(#my-glow)"/>
  <circle cx="40" cy="64" r="5" fill="#C084FC"/>
</svg>