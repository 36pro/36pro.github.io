<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00DFD8" />
      <stop offset="50%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>
    <filter id="ap-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="22" fill="#0A0614" stroke="#2D124D" stroke-width="1.5"/>
  <!-- Ambient Plasma Blob -->
  <circle cx="40" cy="40" r="26" fill="url(#ap-grad)" opacity="0.4" filter="url(#ap-blur)"/>
  <!-- Fluid Sculpted 'B' -->
  <path d="M26 16 C36 16, 54 18, 54 28 C54 35, 46 38, 38 39 C48 40, 56 44, 56 52 C56 62, 38 64, 26 64 C20 64, 20 16, 26 16 Z" 
        fill="url(#ap-grad)" stroke="rgba(255,255,255,0.6)" stroke-width="2" filter="url(#ap-blur)"/>
  <!-- Glassmorphic Negative Cutouts with Specular Arc -->
  <ellipse cx="36" cy="28" rx="8" ry="6" fill="#0A0614"/>
  <ellipse cx="38" cy="52" rx="9" ry="7" fill="#0A0614"/>
  <path d="M28 20 Q44 20 48 26" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M30 44 Q48 44 50 50" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>