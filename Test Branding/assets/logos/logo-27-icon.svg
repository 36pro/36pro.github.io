<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="cl-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#0A0F1D" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Two Parallel Capacitor Stems || -->
  <line x1="30" y1="18" x2="30" y2="62" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <line x1="50" y1="18" x2="50" y2="62" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
  <!-- High-Voltage Dielectric Gap Filament -->
  <line x1="30" y1="40" x2="50" y2="40" stroke="#10E575" stroke-width="4" filter="url(#cl-glow)"/>
  <!-- Micro Terminal Dots -->
  <circle cx="30" cy="40" r="3" fill="#2563EB"/>
  <circle cx="50" cy="40" r="3" fill="#10E575"/>
</svg>