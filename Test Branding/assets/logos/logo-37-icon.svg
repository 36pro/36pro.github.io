  <!-- Outer Sacred Ring -->
  <circle cx="40" cy="40" r="28" stroke="#EAB308" stroke-width="2"/>
  <circle cx="40" cy="40" r="23" stroke="#EAB308" stroke-width="1" stroke-dasharray="2 3"/>
  <!-- Alchemical Triangle of Elements -->
