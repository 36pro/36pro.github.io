<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <g transform="translate(20, 50)">
    <!-- B -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">B</text>
    <!-- I -->
    <text x="32" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">I</text>
    <!-- First L -->
    <text x="50" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">L</text>
    <!-- Second L -->
    <text x="76" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF">L</text>
    <!-- Capacitor Spark Line connecting LL -->
    <line x1="68" y1="-14" x2="88" y2="-14" stroke="#10E575" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Z -->
