<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <rect width="80" height="80" rx="18" fill="#060919" stroke="#1A2044" stroke-width="1.5"/>
  <!-- Outer Cube Isometric Frame -->
  <polygon points="40,12 66,26 66,54 40,68 14,54 14,26" stroke="#4338CA" stroke-width="2" fill="none"/>
  <!-- Inner Cube -->
  <polygon points="40,26 52,34 52,48 40,56 28,48 28,34" stroke="#F43F5E" stroke-width="2" fill="none"/>
  <!-- 4D Connecting Vertex Vectors -->
  <line x1="40" y1="12" x2="40" y2="26" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="66" y1="26" x2="52" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="66" y1="54" x2="52" y2="48" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="40" y1="68" x2="40" y2="56" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="14" y1="54" x2="28" y2="48" stroke="#38BDF8" stroke-width="1.5"/>
  <line x1="14" y1="26" x2="28" y2="34" stroke="#38BDF8" stroke-width="1.5"/>
  <!-- Core Focal Node -->
  <circle cx="40" cy="41" r="3" fill="#FFFFFF"/>
</svg>