<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="tm-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>
  <rect width="80" height="80" rx="18" fill="#06101E" stroke="#112744" stroke-width="1.5"/>
  <!-- Top Conduit: Electric (Mint) -->
  <path d="M40 12 V40" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
  <circle cx="40" cy="14" r="5" fill="#00E676"/>
  <!-- Bottom Right Conduit: Hydro (Aqua) -->
  <path d="M40 40 L64 54" stroke="#00C2FF" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="54" r="5" fill="#00C2FF"/>
  <!-- Bottom Left Conduit: Gas (Amber) -->
  <path d="M40 40 L16 54" stroke="#FF7A00" stroke-width="6" stroke-linecap="round"/>
  <circle cx="16" cy="54" r="5" fill="#FF7A00"/>
  <!-- Central Manifold Mixing Core -->
  <circle cx="40" cy="40" r="10" fill="#06101E" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="40" cy="40" r="5" fill="url(#tm-glow)"/>
</svg>