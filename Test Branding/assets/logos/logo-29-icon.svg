<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="mn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#080C14" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Left Monolith Pillar Face -->
  <polygon points="20,20 38,12 38,68 20,60" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <!-- Right Monolith Pillar Face -->
  <polygon points="42,12 60,20 60,60 42,68" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <!-- Center Vertical Laser Trench -->
  <line x1="40" y1="8" x2="40" y2="72" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" filter="url(#mn-glow)"/>
</svg>